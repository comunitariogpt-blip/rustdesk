name: Full Flutter CI

# Gatilhos automaticos desativados. ATENCAO: este workflow chama o
# flutter-build.yml inteiro (todas as plataformas) - rodava um build completo a
# cada push no master. Rode manualmente em Actions -> Run workflow.
on:
  workflow_dispatch:

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
